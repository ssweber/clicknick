name: Docs

# The public site describes the latest release, not main. Pull requests build it
# (no deploy). A deploy is a workflow_dispatch on main: publish.yml starts one with
# the release's tag once the trust report is attached; by hand, `ref` defaults to
# the latest release.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (default: the latest release)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Choose the release to build
        id: source
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          fi
          echo "Building $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python
        run: uv python install

      - name: Install docs dependencies only
        run: uv sync --locked --only-group docs

      - name: Cache-bust extra assets
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          sed -i -E "s#^(\s*- (stylesheets|javascripts)/[^?[:space:]]+)\$#\1?v=${sha}#" mkdocs.yml
          grep -E '\?v=' mkdocs.yml

      # Per-release trust reports and SBOMs are release assets; mirror them
      # into the site so pyrung.com/clicknick/security/ has every version.
      - name: Collect trust reports from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python .github/scripts/collect_trust_reports.py

      - name: Build docs
        run: uv run --no-sync zensical build --clean --strict

      - name: Guard public site
        run: uv run --no-sync python .github/scripts/check_public_site.py site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
