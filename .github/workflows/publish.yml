name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag with an unpublished draft release (for example v0.23.1)
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    name: Build distribution
    runs-on: windows-latest
    steps:
      - name: Check draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'release_tag must be a stable version tag such as v0.23.1'
          }
          $isDraft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'true') {
            throw 'Create a draft release for this tag before running the publish workflow.'
          }

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: auto
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Build package
        run: uv build

      - name: Build trust report
        run: uv run --no-sync python devtools/trust_report.py --out trust

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Upload trust report
        uses: actions/upload-artifact@v4
        with:
          name: trust-report
          path: trust/

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Download trust report
        uses: actions/download-artifact@v4
        with:
          name: trust-report
          path: trust/

      # Published releases are immutable: attach every report while still a draft.
      - name: Attach reports to draft release
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" trust/* --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish GitHub release
        run: gh release edit "$RELEASE_TAG" --draft=false

  docs:
    name: Refresh release reports on docs site
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Build docs with the newly attached reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
