name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # JOB 1: Build on Windows (handles pywin32)
  build:
    name: Build distribution
    runs-on: windows-latest
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # 0.12.x is needed for `uv export --format cyclonedx1.5` and `uv audit`.
          version: "0.12.1"
          enable-cache: auto
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # This works now because we are on Windows
        run: uv sync --locked --all-extras --dev

      - name: Build package
        run: uv build

      # SBOM, dependency table and release checks. Fails the release on a red check.
      - name: Build trust report
        run: uv run --no-sync python devtools/trust_report.py --out trust

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Upload trust report
        uses: actions/upload-artifact@v4
        with:
          name: trust-report
          path: trust/

  # JOB 2: Publish on Linux (Required for pypa action)
  publish:
    name: Publish to PyPI
    needs: build  # Waits for the build job to finish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: Mandatory for trusted publishing
      contents: write  # Attach the trust report and SBOM to the GitHub release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Download trust report
        uses: actions/download-artifact@v4
        with:
          name: trust-report
          path: trust/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Immutable per-release copies. The docs workflow mirrors these to
      # pyrung.com/clicknick/security/ on its next run.
      - name: Attach trust report to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" trust/* --repo "${{ github.repository }}" --clobber
