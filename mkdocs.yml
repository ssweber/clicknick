site_name: ClickNick
site_description: Better tools for writing, checking, testing, and maintaining AutomationDirect CLICK ladder.
site_url: https://pyrung.com/clicknick/
repo_url: https://github.com/ssweber/clicknick
repo_name: ssweber/clicknick

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Install: install.md
  - Getting Started: getting-started.md
  - Product Tour:
      - Stop Memorizing Addresses: tour/autocomplete.md
      - Check Your Ladder: tour/checks.md
      - Run Without the PLC: tour/offline-console.md
      - Readable History: tour/readable-history.md
      - Keep the Engineering Work: tour/engineering-workspace.md
      - AI in the Workspace: tour/ai-in-the-workspace.md
  - Help:
      - help/index.md
      - Tools: help/tools.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
