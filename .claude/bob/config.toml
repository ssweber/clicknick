# bob settings for ClickNick (the bob plugin, github.com/ssweber/bob). No merge queue:
# branches go into main through pull requests, gated by CI.
# Paths are relative to the project root, the folder that holds .claude/.

worktree_root = "../clicknick-wt"          # `run.py worktree new NAME` -> <worktree_root>/NAME
procs_dir = "../clicknick-wt/.bob/procs"   # one file per live bounded run (`run.py ps`), and the slot locks
base = "origin/main"                       # new worktrees start here, with no upstream
branch_prefix = "bob/"                     # `worktree new NAME` makes branch <prefix>NAME unless --branch
job_memory_mb = 8192                       # cap per run, all its processes (Windows Job Object); 0 = no cap
targeted_slots = 3                         # bounded runs at once; the rest wait. 0 = no limit
targeted_wait = 1800                       # seconds a run waits for a slot, then exits 125

# PreToolUse hook. Regexes are searched in the shell command text, quoted strings and heredoc
# bodies blanked.
[hook]
# Bash commands that get a hard timeout and a named process group: they are rewritten to
# `run.py --timeout N --name <agent>@<worktree> -- bash -c '...'` (N from a leading
# `timeout N`, else default_timeout). `make docs-serve` is a server and runs as typed.
bash_wrap = ['\bpytest\b', '\bmake\b(?!\s+docs-serve\b)']
# PowerShell commands that are refused with the fix (run them through run.py, or in Bash).
powershell_refuse = ['\bpytest\b']
default_timeout = 600

# bob-reviewer and bob-investigator are read-only: the hook refuses the builder's and the
# orchestrator's jobs (writing the work, committing, pushing, changing the environment), and
# code outside the bounded runner (the plugin's README: The hook). Their redirects, Write/Edit
# calls and rm/mv/cp/mkdir/touch/tee reach only these roots (and /dev/null, /dev/stdout,
# /dev/stderr).
reviewer_write_roots = ["$TEMP", "$TMP", "/tmp"]
# The reviewer runs a probe script under a write root only as `python -I
# <plugin>/scripts/run.py --timeout N [--name X] [--cwd D] -- [uv run --no-sync] python
# <script>.py`, with N up to this.
reviewer_max_timeout = 1800
# With a [queue] section (queue.toml): every non-light stage is heavy, plus these. Heavy
# commands are refused for subagents; the main session runs them through `mergeq.py run
# --heavy` or the queue. heavy_exempt takes a main-session command back out.
# ClickNick has no queue, so these are not read: profile.md's rule keeps agents off a bare `make`.
heavy_extra = []
heavy_exempt = []

[ps]
# Processes shown by `run.py ps --all` and offered to `reap --unmanaged`.
names = ["python.exe", "python3.exe", "pytest.exe", "make.exe", "uv.exe"]
# Never listed or reaped (language servers, linters' daemons).
ignore = ['pyright', 'langserver', 'language[-_]server', '\bty\b.*\bserver\b', 'ruff\s+server', 'debugpy']
