<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">A persistent ClickNick workspace</title>
  <desc id="desc">A CLICK project named CasePacker reconnects to a CasePacker Workspace folder by PLC name. ClickNick refreshes the ladder as text, the accepted CLICK snapshot, and nickname data on every save. Tests, notes, and fixtures the engineer adds stay.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496276"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; stroke: #d7e0e7; stroke-width: 2; }
      .heading { fill: #172a3a; font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .subheading { fill: #496276; font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .box-title { fill: #172a3a; font: 700 19px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .body { fill: #294354; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { fill: #193548; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .small { fill: #496276; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .identity { fill: #ffffff; stroke: #5c7890; stroke-width: 2; }
      .managed { fill: #eaf4ff; stroke: #4d87b8; stroke-width: 2; }
      .yours { fill: #edf8ef; stroke: #5b9566; stroke-width: 2; }
      .connector { fill: none; stroke: #496276; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" x="10" y="10" width="1020" height="540" rx="24"/>
  <text class="heading" x="50" y="62">One folder per machine</text>
  <text class="subheading" x="50" y="91">The PLC name connects the open CLICK project to its workspace.</text>

  <rect class="identity" x="50" y="125" width="310" height="100" rx="14"/>
  <text class="box-title" x="75" y="160">Open CLICK project</text>
  <text class="mono" x="75" y="190">CasePacker.ckp</text>
  <text class="small" x="75" y="212">PLC name: CasePacker</text>

  <path class="connector" d="M 382 175 L 470 175"/>
  <text class="small" x="426" y="160" text-anchor="middle">PLC name</text>

  <rect class="identity" x="492" y="125" width="498" height="100" rx="14"/>
  <text class="box-title" x="517" y="160">CasePacker Workspace/</text>
  <text class="mono" x="517" y="190">.clicknick.toml</text>
  <text class="small" x="672" y="190">name = "CasePacker"</text>

  <rect class="managed" x="50" y="265" width="455" height="230" rx="16"/>
  <text class="box-title" x="75" y="302">ClickNick refreshes on every save</text>
  <text class="mono" x="75" y="342">src/plc/</text>
  <text class="body" x="230" y="342">the ladder as text</text>
  <text class="mono" x="75" y="378">csv/</text>
  <text class="body" x="230" y="378">the snapshot CLICK accepted</text>
  <text class="mono" x="75" y="414">nicknames.csv</text>
  <text class="body" x="230" y="414">addresses and nicknames</text>
  <text class="small" x="75" y="464">Edit it and Preview Changes shows the diff.</text>

  <rect class="yours" x="535" y="265" width="455" height="230" rx="16"/>
  <text class="box-title" x="560" y="302">Yours stays</text>
  <text class="mono" x="560" y="342">tests/</text>
  <text class="body" x="715" y="342">machine behavior, pinned</text>
  <text class="mono" x="560" y="378">notes/</text>
  <text class="body" x="715" y="378">startup notes, the why</text>
  <text class="mono" x="560" y="414">fixtures/</text>
  <text class="body" x="715" y="414">known-good tag states</text>
  <text class="small" x="560" y="464">A smoke test and README are seeded once, then left alone.</text>

  <text class="small" x="50" y="530">Add anything else you want kept with the machine. It survives every refresh.</text>
</svg>
